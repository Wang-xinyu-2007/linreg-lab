name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solutions:
    runs-on: ubuntu-latest
    env:
      LINREG_SOLUTIONS: "1"     # CI 测参考答案；exercises/ 本来就是空的
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 numpy
        run: python -m pip install numpy

      - name: 跑测试
        run: python -m unittest discover -s tests -v

      - name: 跑一遍 demo
        run: python demo.py --solutions

      - name: 确认关卡加载器工作正常
        run: python check.py --solutions
